<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归属账本：卸载怎么知道哪一行是我们加的</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lede {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">自定义构图 · 归属账本</p>
    <h1>归属账本：卸载怎么知道哪一行是我们加的</h1>
    <p class="lede">安装时把「我们改了什么」记进 <code>install-manifest.json</code>；卸载按字段决定动作。清单丢了也不猜：逐字节认领，认不出来就保留并告警，doctor 会把残留判红。</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownership-ledger-title ownership-ledger-desc">
        <title id="ownership-ledger-title">归属账本：卸载怎么知道哪一行是我们加的</title>
        <desc id="ownership-ledger-desc">安装清单记录每个 profile 的归属字段；卸载按字段摘行或只摘 disabled。清单缺失时逐字节认领，认不出就保留并告警，doctor 判红。</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- 账本面板 -->
        <rect x="64" y="112" width="440" height="264" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="88" y="140" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">安装时写入：install-manifest.json</text>

        <text x="88" y="176" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">profiles.desktop:</text>
        <text x="88" y="200" xml:space="preserve" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">  uiPermissionAction: added</text>
        <text x="88" y="224" xml:space="preserve" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">  permissionPresetAction: added</text>
        <text x="88" y="248" xml:space="preserve" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">  permissionDefaultAction: kept</text>
        <text x="88" y="272" xml:space="preserve" fill="#2d3142" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">  original: …bak-enhance-20261029</text>
        <text x="88" y="296" xml:space="preserve" fill="#5a6580" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">  # 每个 profile 一条；value 是「我们当时做了什么」</text>
        <text x="88" y="336" xml:space="preserve" fill="#5a6580" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">  fileHashes: 15 件（doctor 用来查改坏）</text>

        <!-- 账本 → 三条规则 -->
        <path d="M504,180 H544" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M504,276 H544" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M504,372 H544" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 三条规则 -->
        <rect x="544" y="144" width="440" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">uiPermissionAction: added</text>
        <text x="560" y="194" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">→ 整行是我们插的：摘整行</text>

        <rect x="544" y="240" width="440" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">uiPermissionAction: flipped</text>
        <text x="560" y="290" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">→ 官方行是我们停的：只摘 disabled</text>

        <rect x="544" y="336" width="440" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">permissionPresetAction: added</text>
        <text x="560" y="386" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">→ 权限表/档位是我们插的：摘掉它</text>

        <!-- 兜底路径 -->
        <text x="64" y="444" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">清单丢了 / 字段缺失时（旧安装、手删清单）</text>

        <path d="M288,520 H352" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="296" y="498" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="510" text-anchor="middle" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">认不出</text>
        <path d="M640,520 H704" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="644" y="498" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="672" y="510" text-anchor="middle" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">残留可见</text>

        <rect x="64" y="480" width="224" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="80" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">逐字节认领</text>
        <text x="80" y="530" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">与我们的输出逐字节比对</text>

        <rect x="352" y="480" width="288" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="368" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">认不出归属</text>
        <text x="368" y="530" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">不猜：原样保留 + 打 warn</text>

        <rect x="704" y="480" width="296" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="720" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">doctor 判红</text>
        <text x="720" y="530" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">残留看得见，人工核对</text>

        <!-- 注释 -->
        <text x="64" y="608" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', serif">规则只有一条：能证明确实是我们写的，才动；证明不了，就留给人工。</text>

        <!-- 图例 -->
        <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="40" y="664" width="12" height="12" rx="2" fill="#ececec" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="60" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">账本</text>
        <rect x="130" y="664" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="150" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">规则与结果</text>
        <rect x="270" y="664" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="290" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">焦点：不猜的那条路</text>
      </svg>
    </div>
  </div>
</body>
</html>
