<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>门禁与负例：绿不是信，能红才是</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lede {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · 门禁</p>
    <h1>门禁与负例：绿不是信，能红才是</h1>
    <p class="lede">六道 fast 门禁串成一条链；绿灯只说明「这次没抓到」。真正证明门禁活着的是负例：在一次性副本上把守卫改回旧写法，它必须变红。</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gates-and-negatives-title gates-and-negatives-desc">
        <title id="gates-and-negatives-title">门禁与负例：绿不是信，能红才是</title>
        <desc id="gates-and-negatives-desc">六道 fast 门禁依次运行：version（含 DSH 兼容声明）、syntax、tests、graph、docs、bundle；每道门在副本上都有负例，把守卫改回旧写法后必须变红。</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- 门禁链 -->
        <line x1="208" y1="200" x2="232" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="376" y1="200" x2="400" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="544" y1="200" x2="568" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="712" y1="200" x2="736" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="880" y1="200" x2="904" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1048" y1="200" x2="1072" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 六道门 -->
        <rect x="64" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="136" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">version</text>

        <rect x="232" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="304" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">syntax</text>

        <rect x="400" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="472" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">tests</text>

        <rect x="568" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">docs</text>

        <rect x="736" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="808" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">graph</text>

        <rect x="904" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="976" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">docs</text>

        <rect x="1072" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1144" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">lifecycle</text>

        <!-- 负例：从链上取一道门，回退源码看它红不红 -->
        <line x1="64" y1="248" x2="1216" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="64" y1="248" x2="64" y2="256" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="1216" y1="248" x2="1216" y2="256" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <rect x="520" y="264" width="240" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="276" text-anchor="middle" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">整条链的每一道门都有对应负例</text>

        <rect x="300" y="320" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="316" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">一次性副本：把守卫改回旧写法</text>
        <text x="316" y="370" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">不改真仓库，不动工作树</text>

        <path d="M580,360 H700" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="588" y="336" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="620" y="348" text-anchor="middle" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">逐门跑</text>

        <rect x="700" y="320" width="280" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="716" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">该门必须红</text>
        <text x="716" y="370" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">红了，才说明守卫在吃劲</text>

        <!-- 注释 -->
        <text x="64" y="480" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', serif">负例不造坏产物：造出来的正是被测代码该抓的东西，证明不了守卫本身还在。</text>
        <text x="64" y="512" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', serif">full 层多一道：graph-strict（逐字节比图）；没有产物记 SKIP，不算 PASS。</text>

        <!-- 图例 -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="40" y="668" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="678" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">fast 门禁</text>
        <line x1="170" y1="674" x2="226" y2="674" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="238" y="678" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">负例入口</text>
        <rect x="330" y="668" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="350" y="678" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">焦点：必须变红</text>
      </svg>
    </div>
  </div>
</body>
</html>
