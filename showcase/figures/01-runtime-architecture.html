<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运行期架构：enhance 只通过 patch 行接入宿主</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lede {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 运行期</p>
    <h1>enhance 只通过 patch 行接入宿主</h1>
    <p class="lede">宿主启动时加载 <code>cordis.patch.yml</code> 里的几行，这几行用相对路径指向 <code>&lt;home&gt;/enhance/</code>；插件与共享模块、内容边界文本、状态文件、设置页都落在这个目录里。</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-architecture-title runtime-architecture-desc">
        <title id="runtime-architecture-title">运行期架构：enhance 只通过 patch 行接入宿主</title>
        <desc id="runtime-architecture-desc">宿主通过 cordis.patch.yml 里的插入行与权限替换行加载 enhance 目录下的插件；插件读取内容边界文本与状态文件，设置页经 API 读写这两个文件。</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- 分区：宿主 / 配置 / 落盘 -->
        <rect x="40" y="96" width="300" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="380" y="96" width="330" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="748" y="96" width="492" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="48" y="100" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <rect x="388" y="100" width="136" height="16" rx="2" fill="#f5f5f5"/>
        <rect x="756" y="100" width="148" height="16" rx="2" fill="#f5f5f5"/>
        <text x="56" y="112" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">宿主</text>
        <text x="396" y="112" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">配置：profile patch</text>
        <text x="764" y="112" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">落盘：&lt;home&gt;/enhance/</text>

        <!-- 箭头先画（压在节点下面） -->
        <!-- 宿主 → 配置 -->
        <path d="M284,284 H364 q8,0 8,-8 V232 q0,-8 8,-8 H404" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="296" y="260" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="328" y="272" text-anchor="middle" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">启动加载</text>

        <!-- 插入行 → 插件目录 -->
        <path d="M684,216 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="690" y="192" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="730" y="204" text-anchor="middle" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">相对路径导入</text>

        <!-- 权限替换行 → 插件目录 -->
        <path d="M684,372 H716 q8,0 8,-8 V276 q0,-8 8,-8 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 插件 → 内容边界文本 -->
        <path d="M846,288 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="854" y="312" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="858" y="324" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">读文本</text>

        <!-- 插件 → 状态文件 -->
        <path d="M994,288 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1002" y="312" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1006" y="324" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">读开关</text>

        <!-- 设置页 → 插件（API） -->
        <path d="M1148,344 V288" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="1156" y="312" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1160" y="324" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">API 读写</text>

        <!-- 节点：宿主 -->
        <rect x="64" y="248" width="220" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">DSH 宿主</text>
        <text x="80" y="298" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">Electron · 进程内装配</text>

        <!-- 节点：插入行 -->
        <rect x="404" y="176" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="420" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">3 行 insert</text>
        <text x="420" y="226" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">enhance-scope · auto-approve · enhance-ui</text>

        <!-- 节点：权限替换行（焦点） -->
        <rect x="404" y="336" width="280" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="420" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">permission 行（可选）</text>
        <text x="420" y="386" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">替换官方 ui-permission（菜单图标）</text>

        <!-- 节点：插件与共享层 -->
        <rect x="776" y="176" width="440" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="792" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">4 个插件 + 5 个共享模块</text>
        <text x="792" y="236" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">enhance-scope · auto-approve · ui（+ 可选写入 permission 行）</text>
        <text x="792" y="254" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">shared/state · seed · session-probe · preset-shape · preset</text>

        <!-- 节点：内容边界文本 -->
        <rect x="776" y="344" width="140" height="68" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="792" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">内容边界文本</text>
        <text x="792" y="394" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">content-scope.txt</text>

        <!-- 节点：状态文件 -->
        <rect x="924" y="344" width="140" height="68" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="940" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">状态文件</text>
        <text x="940" y="394" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">state.json</text>

        <!-- 节点：设置页 -->
        <rect x="1080" y="344" width="136" height="68" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="1096" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">设置页</text>
        <text x="1096" y="394" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">ui/ · 宿主 web</text>

        <!-- 注释：两处大白话边界 -->
        <text x="64" y="556" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', serif">官方 fs-observation-policy（先读后写）不属于本工具：装/卸都不读不写。</text>
        <text x="64" y="592" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', serif">默认只装 desktop；headless / web 需要显式 --profiles。</text>

        <!-- 图例 -->
        <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="40" y="664" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">节点</text>
        <rect x="150" y="664" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="170" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">落盘文件</text>
        <rect x="300" y="664" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="320" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">焦点：权限替换行</text>
        <line x1="520" y1="670" x2="556" y2="670" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="568" y="674" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">HTTP API</text>
      </svg>
    </div>
  </div>
</body>
</html>
