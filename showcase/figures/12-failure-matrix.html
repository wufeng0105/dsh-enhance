<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>失败矩阵：每个坑由谁发现，或者只能人工核对</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lede {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">自定义构图 · 失败矩阵</p>
    <h1>失败矩阵：每个坑由谁发现，或者只能人工核对</h1>
    <p class="lede">门禁和设置页检查不是万能的。这张表把「可能坏在哪」和「谁会发现」放在一起；标出来的那一行合并了两条设计边界——没有自动检测，只能人工核对。</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="failure-matrix-title failure-matrix-desc">
        <title id="failure-matrix-title">失败矩阵：每个坑由谁发现，或者只能人工核对</title>
        <desc id="failure-matrix-desc">五行失败形态分别对应设置页检查、门禁与自检、人工三种发现方式；无 Origin 放行与会话探针读错会话只能人工核对。</desc>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- 表头 -->
        <text x="64" y="140" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">失败形态</text>
        <text x="480" y="140" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">check 门禁 / 设置页检查</text>
        <text x="736" y="140" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">门禁 / 自检</text>
        <text x="992" y="140" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">设置页 / 人工</text>
        <line x1="64" y1="160" x2="1216" y2="160" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <!-- 第 1 行 -->
        <rect x="64" y="176" width="1152" height="64" fill="rgba(45,49,66,0.02)"/>
        <text x="80" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">approval: never（宿主不发请求）</text>
        <text x="80" y="224" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">三态里 allow 轮不到</text>
        <text x="480" y="210" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● 档位语义判红</text>
        <text x="736" y="210" fill="#5a6580" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">—</text>
        <text x="992" y="204" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">◐ 显示「轮不到」</text>
        <text x="992" y="224" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">需要人读结论句</text>

        <!-- 第 2 行 -->
        <text x="80" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">文本超过 8 KB</text>
        <text x="80" y="288" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">直接编辑文件写超限</text>
        <text x="480" y="274" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● home-text 判红</text>
        <text x="736" y="274" fill="#5a6580" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">—</text>
        <text x="992" y="274" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● 保存前拦</text>

        <!-- 第 3 行 -->
        <rect x="64" y="304" width="1152" height="64" fill="rgba(45,49,66,0.02)"/>
        <text x="80" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">patch 结构坏（重复键 / 缩进）</text>
        <text x="80" y="352" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">行级追加后手改坏了</text>
        <text x="480" y="338" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● dup-keys / patch 行</text>
        <text x="736" y="338" fill="#5a6580" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">—</text>
        <text x="992" y="338" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">◐ 指到行号，人工修</text>

        <!-- 第 4 行 -->
        <text x="80" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">装了但没接线（零目标安装）</text>
        <text x="80" y="416" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">enhance/ 在，patch 无引用</text>
        <text x="480" y="402" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● profiles-wired 判红</text>
        <text x="736" y="402" fill="#5a6580" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● 安装前拒绝</text>
        <text x="992" y="402" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● 重装提示</text>

        <!-- 第 5 行（焦点：设计边界） -->
        <rect x="64" y="432" width="1152" height="64" fill="rgba(191,69,32,0.08)"/>
        <rect x="64" y="432" width="2" height="64" fill="#bf4520"/>
        <text x="80" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">无 Origin 放行 / 探针读错会话</text>
        <text x="80" y="480" fill="#5a6580" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">设计边界：接口无 token；探针只读最新会话</text>
        <text x="480" y="466" fill="#5a6580" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">○ 不报</text>
        <text x="736" y="466" fill="#5a6580" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">○ 不覆盖</text>
        <text x="992" y="466" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">○ 只能人工核对</text>

        <!-- 注释 -->
        <text x="64" y="548" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Noto Serif', 'Songti SC', serif">绿色只覆盖被检查过的东西；标出来的这一行没有自动检测，属于已知限制，不假装它被覆盖。</text>

        <!-- 图例 -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="678" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">● 自动发现</text>
        <text x="160" y="678" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">◐ 部分发现（要人读）</text>
        <text x="360" y="678" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">○ 不检测</text>
        <text x="480" y="678" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">— 不适用</text>
        <rect x="600" y="668" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="620" y="678" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">焦点：已知限制（只能人工）</text>
      </svg>
    </div>
  </div>
</body>
</html>
