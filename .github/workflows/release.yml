name: release

# 发版：推一个 `v*` 标签就发布到 npm。
#
# 为什么不用长期 token（NPM_TOKEN）：

# npm 在 2026-07 的公告里写明，勾了「bypass 2FA」的 granular access token
# 从 2026-08 起不能做账号/包管理动作，**约 2027-01 起连直接发布也不行**——
# 它们的发布面会收缩到「读私有包」与「暂存一次发布，等人用 2FA 批准」。
# 所以这里走 **trusted publishing（OIDC）**：GitHub 签一张短时身份断言给 npm，
# 没有长期密钥可泄漏、也不用轮换。`id-token: write` 就是那一步的授权。
#
# ⚠️ 一次性配置（不在这个文件里，必须在 npmjs.com 上做）：
#    包的 Settings → Trusted publishing → 加一条 GitHub 可信发布者，
#    填这个仓库（wufeng0105/dsh-enhance）与本文件名（release.yml）。
#    在配好之前，这个工作流会失败——那说明还没有可信发布者，不是代码坏了。
#
# 手动发版仍可用 `node scripts/release.mjs <版本> --publish`（需要 2FA 验证码）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # trusted publishing 需要它来申请 OIDC 身份断言。
  id-token: write
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 建 GitHub Release 要写 contents。放在 job 级而不是顶层，
    # 是为了让「只读的门禁步骤」不带写权限——同一条流水线里权限要跟着步骤走。
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `version` 门要用 git 历史核对「适用版本」句，浅克隆会让它读不到。
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # 让 npm 知道目标是官方源；trusted publishing 不接受指向别处的发布。
          registry-url: https://registry.npmjs.org

      # trusted publishing 要求 npm >= 11.5。ubuntu-latest 自带的可能更旧。
      - name: npm 版本
        run: |
          npm install -g npm@latest
          npm --version

      # 标签与 VERSION 必须一致：防止「推了 v2.0.0 却发出去 1.9.0」。
      # 只在标签推送时核对——手动触发跑在分支上，GITHUB_REF_NAME 是分支名，比了必错。
      - name: 核对标签与 VERSION
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '\r\n' < VERSION)"
          echo "tag=$tag VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 v$tag 与 VERSION $version 不一致——先改 VERSION/package.json，再打标签"
            exit 1
          fi

      # 发之前先过门禁：这个包已经在 npm 上，发一个坏版本比不发更糟。
      - name: 门禁
        run: node scripts/check.mjs

      # 幂等：这个版本已经在 npm 上就跳过发布，只往下建 Release。
      # 用途是补一条已经手工发过的版本，以及工作流重跑时不因为「版本已存在」整条红掉。
      #
      # 两种发布身份，先看有没有 NPM_TOKEN：
      #   - 有：用仓库 secret 里的 granular access token（当前是这条——
      #     trusted publishing 还在等安全密钥，见 CONTRIBUTING 的「发布」一节）；
      #   - 没有：走 OIDC 可信发布（`id-token: write` 已在上面授权）。
      # 配好 trusted publishing 之后把 secret 删掉，就自动切到 OIDC，这个文件不用再改。
      - name: 选发布身份
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::用 NPM_TOKEN 发布"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::没有 NPM_TOKEN，走 OIDC 可信发布"
          fi

      - name: 发布（NPM_TOKEN）
        if: github.event_name == 'push' && steps.auth.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(tr -d '\r\n' < VERSION)"
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "::notice::npm 上已有 $pkg@$version，跳过发布，继续建 Release"
          else
            npm publish --access public
          fi

      - name: 发布（OIDC 可信发布）
        if: github.event_name == 'push' && steps.auth.outputs.mode == 'oidc'
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(tr -d '\r\n' < VERSION)"
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "::notice::npm 上已有 $pkg@$version，跳过发布，继续建 Release"
          else
            npm publish --access public --provenance
          fi

      # 建 GitHub Release，正文取 CHANGELOG 里 `## [<version>]` 那一节——
      # 不另写一份发布说明，免得「代码里的变更记录」和「Release 页面」各说各话。
      #
      # 幂等：Release 已存在就跳过。否则同一个 tag 重跑（补建、排障、改 notes）会在
      # npm 那步已成功之后栽在 `release already exists` 上，把无害重跑变成红灯。
      - name: 建 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME 已存在，跳过"
            exit 0
          fi
          # 从 `## [<version>]` 起，到下一个 `## [` 之前为止。
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -n "$(tr -d '[:space:]' < release-notes.md)" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            echo "::warning::CHANGELOG 里没有 [$version] 一节，改用自动生成的发布说明"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: 预演（只打包，不发布）
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run
