name: release

# 发版：推一个 `v*` 标签就发布到 npm。
#
# 为什么不用长期 token（NPM_TOKEN）：

# npm 在 2026-07 的公告里写明，勾了「bypass 2FA」的 granular access token
# 从 2026-08 起不能做账号/包管理动作，**约 2027-01 起连直接发布也不行**——
# 它们的发布面会收缩到「读私有包」与「暂存一次发布，等人用 2FA 批准」。
# 所以这里走 **trusted publishing（OIDC）**：GitHub 签一张短时身份断言给 npm，
# 没有长期密钥可泄漏、也不用轮换。`id-token: write` 就是那一步的授权。
#
# ⚠️ 一次性配置（不在这个文件里，必须在 npmjs.com 上做）：
#    包的 Settings → Trusted publishing → 加一条 GitHub 可信发布者，
#    填这个仓库（wufeng0105/dsh-enhance）与本文件名（release.yml）。
#    在配好之前，这个工作流会失败——那说明还没有可信发布者，不是代码坏了。
#
# 手动发版仍可用 `node scripts/release.mjs <版本> --publish`（需要 2FA 验证码）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包预演，不真的发布
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # trusted publishing 需要它来申请 OIDC 身份断言。
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # `version` 门要用 git 历史核对「适用版本」句，浅克隆会让它读不到。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 让 npm 知道目标是官方源；trusted publishing 不接受指向别处的发布。
          registry-url: https://registry.npmjs.org

      # trusted publishing 要求 npm >= 11.5。ubuntu-latest 自带的可能更旧。
      - name: npm 版本
        run: |
          npm install -g npm@latest
          npm --version

      # 标签与 VERSION 必须一致：防止「推了 v2.0.0 却发出去 1.9.0」。
      - name: 核对标签与 VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '\r\n' < VERSION)"
          echo "tag=$tag VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 v$tag 与 VERSION $version 不一致——先改 VERSION/package.json，再打标签"
            exit 1
          fi

      # 发之前先过门禁：这个包已经在 npm 上，发一个坏版本比不发更糟。
      - name: 门禁
        run: node scripts/check.mjs --layer fast

      - name: 发布
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance

      - name: 预演（只打包，不发布）
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run
